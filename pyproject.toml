[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highway-lane-planning"
version = "0.1.0"
description = "Independent recreation of A Long-Short-Term Mixed-Integer Formulation for Highway Lane Change Planning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Rudolf Reiter"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "casadi==3.7.2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "matplotlib>=3.7,<4"]

[project.scripts]
highway-lane-planning = "highway_planning.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
